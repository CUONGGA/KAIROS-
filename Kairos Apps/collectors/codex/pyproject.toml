[project]
name = "kairos-codex"
version = "0.1.0"
description = "Codex session collector for Kairos"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
kairos-codex = "kairos_codex.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
